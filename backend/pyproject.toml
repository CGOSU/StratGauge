[project]
name = "stratgauge-backend"
version = "0.1.0"
description = "StratGauge A-share strategy assistant backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "polars>=1.43.2",
    "pydantic>=2.7,<3",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
live-data = [
    "akshare>=1.18.83",
    "baostock>=0.9.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
